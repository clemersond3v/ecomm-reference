services:
  postgres_catalog:
    image: postgres:16
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres_order:
    image: postgres:16
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog-service:
    build:
      context: ../../
      dockerfile: apps/catalog-service/Dockerfile
    environment:
      PORT: "4001"
      SERVICE_NAME: "catalog-service"
    ports:
      - "4001:4001"
    depends_on:
      postgres_catalog:
        condition: service_healthy

  order-service:
    build:
      context: ../../
      dockerfile: apps/order-service/Dockerfile
    environment:
      PORT: "4002"
      SERVICE_NAME: "order-service"
    ports:
      - "4002:4002"
    depends_on:
      postgres_order:
        condition: service_healthy

  gateway:
    build:
      context: ../../
      dockerfile: apps/gateway/Dockerfile
    environment:
      PORT: "4000"
      SERVICE_NAME: "gateway"
      CATALOG_BASE_URL: "http://catalog-service:4001"
      ORDER_BASE_URL: "http://order-service:4002"
    ports:
      - "4000:4000"
    depends_on:
      - catalog-service
      - order-service

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
      NEXT_PUBLIC_GRAPHQL_URL: "http://gateway:4000/graphql"
    ports:
      - "3000:3000"
    depends_on:
      - gateway
